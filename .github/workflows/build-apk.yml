
name: Build CleanCAD APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
      - "opendwg-main.zip"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar herramientas Android
        uses: android-actions/setup-android@v3

      - name: Instalar NDK y CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Extraer proyecto
        run: |
          unzip -q opendwg-main.zip -d source
          find source -maxdepth 3 -name gradlew -print

      - name: Compilar APK
        run: |
          GRADLEW=$(find source -name gradlew -print -quit)
          test -n "$GRADLEW"
          cd "$(dirname "$GRADLEW")"
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanCAD-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-fo
          und: error
