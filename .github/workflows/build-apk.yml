
name: Build CleanCAD APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout CleanCAD source
        uses: actions/checkout@v5
        with:
          repository: june690602-blip/opendwg
          ref: main
          submodules: recursive
          path: source

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Inspect source project
        run: |
          echo "Checking project files..."
          find source -maxdepth 4 \
            \( -name gradlew \
            -o -name settings.gradle \
            -o -name settings.gradle.kts \
            -o -name build.gradle \
            -o -name build.gradle.kts \
            -o -name CMakeLists.txt \) \
            -print

      - name: Verify Gradle wrapper
        working-directory: source
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "::error::No gradlew file found in source root."
            echo "The Android project may be in a subdirectory."
            exit 1
          fi
          chmod +x ./gradlew

      - name: Build debug APK
        working-directory: source
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: CleanCAD-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
